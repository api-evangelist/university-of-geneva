x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated API surfaces were found and verified live on unige.ch hosts (Archive
    ouverte OAI-PMH, Yareta access/ingest, self-hosted GitLab REST v4, Terminus), plus the
    University's own Shibboleth SAML 2.0 IdP in SWITCHaai and three identifier-registry
    memberships. Three limits are worth stating plainly rather than padding around. First, the only
    machine-readable contract UNIGE has is Yareta's, and its origin is gated: /v3/api-docs on both
    access.yareta.unige.ch and ingest.yareta.unige.ch return 401, so the OpenAPI in this repo is a
    derived conversion and is now stamped as such rather than being credited to the institution.
    Second, several plausible surfaces were probed and are genuinely absent: api.unige.ch,
    developers.unige.ch and opendata.unige.ch do not resolve; data.unige.ch exists but is an
    institutional data-governance site, not an open-data portal; and the course catalog at
    pgc.unige.ch soft-404s — /api and /main/api both return 200 with the identical 47,894-byte
    catalog HTML, which is presence without a surface. Third, sparql.unige.ch is registered in
    SWITCHaai but does not resolve publicly, and doc.eresearch.unige.ch/api returns 200 carrying a
    DokuWiki "this topic does not exist yet" body, so neither was credited. No terms-of-service or
    privacy-policy pointer is emitted because none was found on www.unige.ch by footer crawl or
    direct probe of eight candidate paths.
