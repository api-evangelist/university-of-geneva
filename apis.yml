aid: university-of-geneva
name: University of Geneva
x-type: university
x-category: Public Research University
description: >-
  The University of Geneva (Université de Genève, UNIGE) is a public research university in
  Geneva, Switzerland, founded in 1559 and ranked #93 in the QS World University Rankings 2025.
  Like almost every university it is a federation of buyers rather than an API producer, and it
  operates no central developer portal, no API gateway, no public key issuance and no self-service
  onboarding of any kind. What it does operate is unusually real for this cohort, and all of it
  sits under unige.ch: the Archive ouverte UNIGE institutional repository runs on the University's
  OWN software (the Identify response reports "AoU v2.3.5", not DSpace, EPrints or Figshare) and
  serves a live OAI-PMH 2.0 endpoint anonymously; Yareta, the e-Research long-term research-data
  preservation platform built on the Swiss DLCM/Solidify stack that UNIGE itself leads, exposes
  access and ingest REST modules on its own hosts with one genuinely public configuration endpoint
  and everything else behind a bearer token; a self-hosted GitLab serves an anonymous REST API over
  1,146 public projects; and the Terminus protein-prediction service offers a small anonymous
  research API. UNIGE's strongest machine-readable surface is one universities are rarely credited
  for: its own Shibboleth SAML 2.0 Identity Provider, registered in the SWITCHaai national
  federation alongside 122 other unige.ch entities. Its library is a tenancy, not an asset — Ex
  Libris Alma/Primo operated by the SLSP consortium — and its DOI, publication and organization
  identifiers are registry memberships at DataCite, Crossref and ROR. There is no open-data portal,
  no course-catalog API (pgc.unige.ch soft-404s every /api path back to its own HTML) and no
  teaching-and-learning interoperability surface.
