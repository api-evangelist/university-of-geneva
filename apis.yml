- aid: university-of-geneva:switchaai-idp
  name: UNIGE Shibboleth Identity Provider (SWITCHaai)
  x-operator: federation
  description: >-
    The University of Geneva's own SAML 2.0 Shibboleth Identity Provider, published as
    machine-readable metadata in SWITCHaai, the Swiss national research and education identity
    federation. entityID https://idp.unige.ch/idp/shibboleth, shibmd:Scope unige.ch, SSO delegated
    to SWITCH edu-ID at unige.login.eduid.ch. 123 unige.ch entityIDs are registered in the same
    document, including archive-ouverte, gitlab, moodle, mediaserver, votamatic and the eResearch
    authorization server. A federation is shared by definition and the IdP behind it is the
    institution's own — this is UNIGE's strongest institution-operated machine-readable surface and
    the credential behind nearly every gated service below. Verified live 2026-09-01.
