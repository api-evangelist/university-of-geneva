- aid: university-of-geneva:terminus
  name: Terminus Protein Prediction API
  x-operator: institution
  description: >-
    A UNIGE-developed prediction service for protein N-terminal modifications (initial methionine
    cleavage and N-terminal acetylation) across taxonomic groups. Accepts protein sequences by HTTP
    POST in FASTA-to-CSV or JSON-to-JSON mode and returns predictions. Anonymous, no registration,
    no published quota. Documentation verified 200 on 2026-09-01. A small, genuinely institution-run
    research API of exactly the kind this cohort usually has and rarely gets credited for.
  humanURL: https://terminus.unige.ch/info/API
  baseURL: https://terminus.unige.ch/query/
  tags:
  - Bioinformatics
  - Research
  - Proteins
  - Prediction
  properties:
  - type: Documentation
    url: https://terminus.unige.ch/info/API
  - type: Authentication
    url: authentication/university-of-geneva-authentication.yml

