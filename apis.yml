- aid: university-of-geneva:university-of-geneva-access-api
  name: Yareta Access API
  x-operator: institution
  description: >-
    The access/accession module of Yareta, the University of Geneva e-Research long-term
    research-data preservation platform: discover, order and download archives (AIP/DIP). Runs on
    UNIGE's own host access.yareta.unige.ch with contact yareta-admin@unige.ch. The software is the
    Swiss DLCM/Solidify stack, a national project UNIGE leads, so the deployment and the data are
    the institution's. Bearer-gated except GET /default-configuration, which is anonymous and
    declares the institution's ROR id 01swzsf04, its ORCID OAuth wiring and its Shibboleth header
