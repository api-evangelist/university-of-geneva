openapi: 3.0.3
info:
  title: Yareta Research Data Access Ingest API
  description: 'Yareta is the University of Geneva (UNIGE) e-Research long-term research-data preservation and access platform, built on the DLCM (Data Life Cycle Management) software stack. This OpenAPI description merges the public DLCM/Yareta backend modules: the Accession/Access service (https://access.yareta.unige.ch) for discovering, ordering and downloading archives (AIP/DIP), and the Ingestion/Pre-ingest service (https://ingest.yareta.unige.ch) for depositing and submitting research data. Faithfully converted from the live OpenAPI 3.1 definitions (Yareta API v3.1.7); only real paths and schemas are retained.'
  version: 3.1.7
  contact:
    email: yareta-admin@unige.ch
servers:
- url: https://access.yareta.unige.ch
  description: Accession / Access module (discovery, orders, DIP download)
- url: https://ingest.yareta.unige.ch
  description: Pre-ingest / Ingestion module (deposits, submission)
tags:
- name: Ingest
  description: Deposit, validate and submit research data.
paths:
  /preingest/deposits:
    get:
      tags:
      - Ingest
      operationId: preingest_deposits_list
      parameters:
      - name: access
        in: query
        description: The access level of the deposit.
        required: false
        schema:
          type: string
          enum:
          - PUBLIC
          - RESTRICTED
          - CLOSED
      - name: additionalFieldsFormId
        in: query
        description: The additional fields form ID used to generate the additional fields values.
        required: false
        schema:
          type: string
      - name: additionalFieldsValues
        in: query
        description: Some eventual additional fields values generated through an additional fields form.
        required: false
        schema:
          type: string
      - name: archiveTypeId
        in: query
        description: The archive type identifier of the deposit.
        required: false
        schema:
          type: string
      - name: ark
        in: query
        description: The ARK Identifier of the deposit.
        required: false
        schema:
          type: string
      - name: collectionBegin
        in: query
        description: The start date of the deposit for collecting data.
        required: false
        schema:
          type: string
          format: date-time
      - name: collectionEnd
        in: query
        description: The end date of the deposit for collecting data.
        required: false
        schema:
          type: string
          format: date-time
      - name: containsUpdatedMetadata
        in: query
        description: If the package contains updated metadata.
        required: false
        schema:
          type: boolean
      - name: contentStructurePublic
        in: query
        description: If the archive structure content is public.
        required: false
        schema:
          type: boolean
      - name: dataSensitivity
        in: query
        description: The data sensitivity of the deposit.
        required: false
        schema:
          type: string
          enum:
          - UNDEFINED
          - BLUE
          - GREEN
          - YELLOW
          - ORANGE
          - RED
          - CRIMSON
      - name: dataUsePolicy
        in: query
        description: The data use policy of the deposit.
        required: false
        schema:
          type: string
          enum:
          - NONE
          - LICENSE
          - CLICK_THROUGH_DUA
          - SIGNED_DUA
          - EXTERNAL_DUA
      - name: description
        in: query
        description: The description of the deposit.
        required: false
        schema:
          type: string
      - name: doi
        in: query
        description: The Digital Object Identifier (DOI) of the deposit.
        required: false
        schema:
          type: string
      - name: isIdenticalTo
        in: query
        description: DOI indicates that Archive A is identical to B, used to register two separate instances of the same resource.
        required: false
        schema:
          type: string
      - name: isObsoletedBy
        in: query
        description: DOI indicates A is replaced by B.
        required: false
        schema:
          type: string
      - name: languageId
        in: query
        description: The language identifier of the deposit.
        required: false
        schema:
          type: string
      - name: licenseId
        in: query
        description: The license identifier of the deposit.
        required: false
        schema:
          type: string
      - name: metadataVersion
        in: query
        description: The metadata version of the deposit.
        required: false
        schema:
          type: string
          enum:
          - '1.0'
          - '1.1'
          - '2.0'
          - '2.1'
          - '3.0'
          - '3.1'
          - '4.0'
          - '5.0'
      - name: organizationalUnitId
        in: query
        description: The organizational unit identifier of the deposit.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: preparationId
        in: query
        description: The preparation identifier of the deposit.
        required: false
        schema:
          type: string
      - name: preservationPolicyId
        in: query
        description: The preservation policy identifier of the deposit.
        required: false
        schema:
          type: string
      - name: publicationDate
        in: query
        description: The publication date of the deposit.
        required: false
        schema:
          type: string
          format: date
      - name: resId
        in: query
        description: The identifier of the resource. The default format is a Universally Unique IDentifier (UUID).
        required: false
        schema:
          type: string
      - name: sipId
        in: query
        description: The generated SIP identifier of the deposit.
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: The status of the deposit.
        required: false
        schema:
          type: string
          enum:
          - APPROVED
          - CHECKED
          - CLEANED
          - CLEANING
          - COMPLETED
          - DELETING
          - IN_ERROR
          - IN_PROGRESS
          - IN_VALIDATION
          - REJECTED
          - SUBMITTED
          - EDITING_METADATA
          - UPGRADING_METADATA
          - CHECKING_COMPLIANCE
          - CHECKING_COMPLIANCE_CLEANED
          - COMPLIANCE_ERROR
          - CANCEL_EDITING_METADATA
          - EDITING_METADATA_REJECTED
          - SUBMISSION_AGREEMENT_APPROVED
          - RELOADING
      - name: statusMessage
        in: query
        description: The detailed message related to the deposit status.
        required: false
        schema:
          type: string
      - name: submissionPolicyId
        in: query
        description: The submission policy identifier of the deposit.
        required: false
        schema:
          type: string
      - name: title
        in: query
        description: The title of the deposit.
        required: false
        schema:
          type: string
      - name: lightVersion
        in: query
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestCollectionDeposit'
      security:
      - tokenAuth: []
      - auth: []
    post:
      tags:
      - Ingest
      operationId: preingest_deposits_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deposit'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Deposit'
      security:
      - tokenAuth: []
      - auth: []
    delete:
      tags:
      - Ingest
      operationId: preingest_deposits_deleteList
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
      security:
      - tokenAuth: []
      - auth: []
