components:
  schemas:
    SubmissionInfoPackage:
      type: object
      description: Submission Information Package (SIP)
      properties:
        creation:
          $ref: '#/components/schemas/ChangeInfo'
        lastUpdate:
          $ref: '#/components/schemas/ChangeInfo'
        resId:
          type: string
          description: The identifier of the resource. The default format is a Universally Unique IDentifier (UUID).
          maxLength: 50
          minLength: 0
        dispositionApproval:
          type: boolean
          description: If the approval step the AIP disposal is mandatory.
        retention:
          type: integer
          format: int32
          description: 'The retention duration in days of the AIP: O means forever.'
        mainStorage:
          type: integer
          format: int32
          description: The main storage indice in configuration if the SIP. O means default storage (first one).
        aipId:
          type: string
          description: The generated AIP identifier of the SIP.
          maxLength: 50
          minLength: 0
        depositId:
          type: string
          description: The source deposit identifier of the SIP.
          maxLength: 50
          minLength: 0
        info:
          $ref: '#/components/schemas/RepresentationInfo'
          description: The OAIS representation information of the SIP.
        organizationalUnit:
          $ref: '#/components/schemas/OrganizationalUnit'
          description: The organizational unit object of the SIP.
        submissionPolicy:
          $ref: '#/components/schemas/SubmissionPolicy'
          description: The submission policy object of the SIP.
          readOnly: true
        submissionPolicyId:
          type: string
          description: The submission policy identifier of the SIP.
          maxLength: 50
          minLength: 0
        publicationDate:
          type: string
          format: date
          description: The publication date of the deposit.
        organizationalUnitId:
          type: string
          description: The organizational unit identifier of the SIP.
        ready:
          type: boolean
          description: If SIP package is ready.
          readOnly: true
        dataFileNumber:
          type: integer
          format: int32
          description: The number of SIP data files.
          readOnly: true
        collectionSize:
          type: integer
          format: int32
          description: The number of AIPs in collection AIP.
          readOnly: true
        packageStatus:
          type: string
          description: 'OAIS Package Status:

            - CHECKED => Checked package during archiving process

            - CHECKING => A package verification is in progress during checking process

            - CHECK_PENDING => A package verification is pending during checking process

            - CLEANED => Cleaned package during cleaning process for SIP only

            - CLEANING => A package clean is in progress during cleaning process for SIP only

            - COMPLIANCE_LEVEL_UPDATE_PENDING => A package compliance update is pending

            - COMPLIANCE_LEVEL_UPDATED => The compliance levels of the package have been updated

            - COMPLETED => Completed package

            - DISPOSABLE => The Package is candidate for disposal process for AIP only

            - DISPOSAL_APPROVED_BY_ORGUNIT => Disposal org. unit approval done during disposal process for AIP only

            - DISPOSAL_APPROVED => Disposal approval done during disposal process for AIP only

            - DISPOSED => Disposed package for AIP only

            - DOWNLOADING => A package download is in progress

            - EDITING_METADATA => A package metadata edition is in progress

            - FIXING => A package correction is in progress

            - FIXITY_ERROR => Error when checking checksums

            - FIX_PENDING => A package correction is pending

            - INDEXING => A package indexing is in progress

            - IN_ERROR => Package in error during archiving process

            - IN_PREPARATION => Package in preparation during archiving process

            - IN_PROGRESS => A package archiving process is in progress

            - METADATA_EDITION_PENDING => A metadata edition is pending

            - METADATA_UPGRADE_PENDING => A metadata version upgrade is pending

            - PACKAGE_REPLICATION_PENDING => A package replication is pending

            - PRESERVATION_ERROR => Package in error during checking process

            - READY => Package Ready

            - REINDEXING => A package re-indexing is in progress

            - RELOADED => Reloaded package from storage location

            - REPLICATING_PACKAGE => A package replication is in progress

            - REPLICATING_TOMBSTONE => A tombstone package replication is in progress

            - RESUBMITTING => A package re-submission is in progress

            - STORED => Package stored on storage location

            - TOMBSTONE_REPLICATION_PENDING => A tombstone replication is pending

            - UPDATING_COMPLIANCE_LEVEL => A package compliance update is in progress

            - UPDATING_RETENTION => A package retention update is in progress during disposal process

            - UPGRADING_METADATA => A metadata version upgrade is in progress

            '
          enum:
          - CHECK_PENDING
          - CHECKING
          - CHECKED
          - CLEANING
          - CLEANED
          - COMPLETED
          - DOWNLOADING
          - IN_PREPARATION
          - IN_PROGRESS
          - STORED
          - INDEXING
          - READY
          - RETRIEVING
          - RETRIEVING_PENDING
          - IN_ERROR
          - PRESERVATION_ERROR
          - FIXITY_ERROR
          - DISPOSABLE
          - DISPOSAL_APPROVED_BY_ORGUNIT
          - DISPOSAL_APPROVED
          - DISPOSED
          - FIX_PENDING
          - FIXING
          - METADATA_EDITION_PENDING
          - EDITING_METADATA
          - UPDATING_RETENTION
          - METADATA_UPGRADE_PENDING
          - UPGRADING_METADATA
          - COMPLIANCE_LEVEL_UPDATE_PENDING
          - UPDATING_COMPLIANCE_LEVEL
          - COMPLIANCE_LEVEL_UPDATED
          - REINDEXING
          - RELOADED
          - RESUBMITTING
          - PACKAGE_REPLICATION_PENDING
          - REPLICATING_PACKAGE
          - TOMBSTONE_REPLICATION_PENDING
          - REPLICATING_TOMBSTONE
          writeOnly: true
        smartRetention:
          type: string
          description: The retention duration in human-readable format of the package.
          readOnly: true
        _links:
          $ref: '#/components/schemas/Links'
    LicenseLogo:
      type: object
      properties:
        creation:
          $ref: '#/components/schemas/ChangeInfo'
        lastUpdate:
          $ref: '#/components/schemas/ChangeInfo'
        resId:
          type: string
          description: The identifier of the resource. The default format is a Universally Unique IDentifier (UUID).
          maxLength: 50
          minLength: 0
        fileName:
          type: string
          description: The file name.
          maxLength: 2024
          minLength: 0
        fileSize:
          type: integer
          format: int64
          description: The file size in bytes.
        mimeType:
          type: string
          description: The content type of the file. It could be named as MIME type or media type.
        _links:
          $ref: '#/components/schemas/Links'
    SubmissionAgreement:
      type: object
      description: A submission agreement defines the conditions of the submissions.
      properties:
        creation:
          $ref: '#/components/schemas/ChangeInfo'
        lastUpdate:
          $ref: '#/components/schemas/ChangeInfo'
        resId:
          type: string
          description: The identifier of the resource. The default format is a Universally Unique IDentifier (UUID).
          maxLength: 50
          minLength: 0
        title:
          type: string
          description: The title of the submission agreement
        description:
          type: string
          description: The description of the submission agreement
          maxLength: 1024
          minLength: 0
        version:
          type: string
          description: The version of the submission agreement
        submissionAgreementFile:
          $ref: '#/components/schemas/SubmissionAgreementFile'
          description: The submission agreement file
        _links:
          $ref: '#/components/schemas/Links'
    Module:
      type: object
      description: The functional module.
      properties:
        name:
          type: string
          description: The name of the module.
        _links:
          $ref: '#/components/schemas/Links'
    RestCollectionSubmissionAgreement:
      type: object
      description: 'The structure of the REST response:

        - data: the list of objects

        - page: the pagination information

        - links: the HATEOAS links

        - facets: the search information

        '
      properties:
        _links:
          $ref: '#/components/schemas/Links'
        _data:
          type: array
