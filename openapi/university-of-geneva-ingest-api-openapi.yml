        defaultPreservationPolicy:
          $ref: '#/components/schemas/PreservationPolicy'
          description: The default preservation policy of the organizational unit.
        defaultSubmissionPolicy:
          $ref: '#/components/schemas/SubmissionPolicy'
          description: The default submission policy of the organizational unit.
        description:
          type: string
          description: The description of the organizational unit.
          maxLength: 1024
          minLength: 0
        institutions:
          type: array
          items:
            $ref: '#/components/schemas/Institution'
          writeOnly: true
        isEmpty:
          type: boolean
