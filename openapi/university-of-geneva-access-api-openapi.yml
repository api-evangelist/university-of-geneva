          type: string
          enum:
          - UNDEFINED
          - ZIP
          - BAG_IT
      - name: archiveFileNumber
        in: query
        description: The total number of files in the AIP.
        required: false
        schema:
          type: integer
          format: int64
      - name: archiveId
        in: query
        description: The storage URI of the AIP.
        required: false
        schema:
          type: string
      - name: archiveSize
        in: query
