      security:
      - tokenAuth: []
      - auth: []
  /access/orders:
    get:
      tags:
      - Access
      operationId: access_orders_list
      parameters:
      - name: disseminationPolicyId
        in: query
        description: The dissemination policy identifier linked to the order.
        required: false
        schema:
          type: string
      - name: metadataVersion
        in: query
        description: The metadata version of the order query.
        required: false
        schema:
          type: string
          enum:
          - '1.0'
          - '1.1'
          - '2.0'
          - '2.1'
          - '3.0'
          - '3.1'
          - '4.0'
          - '5.0'
      - name: name
        in: query
        description: The name of the order query.
        required: false
        schema:
          type: string
      - name: organizationalUnitDisseminationPolicyId
        in: query
        description: The dissemination policy identifier linked to the orgunit.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: publicOrder
        in: query
        description: If the order is public, false otherwise.
        required: false
        schema:
          type: boolean
      - name: query
        in: query
        description: The query of the order query.
        required: false
        schema:
          type: string
      - name: queryType
        in: query
        description: The type of the order query.
        required: false
        schema:
          type: string
          enum:
          - ADVANCED
          - DIRECT
          - SIMPLE
      - name: resId
        in: query
        description: The identifier of the resource. The default format is a Universally Unique IDentifier (UUID).
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        description: The status of the order query.
        required: false
        schema:
          type: string
          enum:
          - DOWNLOADING
          - IN_DISSEMINATION_PREPARATION
          - IN_ERROR
          - IN_PREPARATION
          - IN_PROGRESS
          - READY
          - SUBMITTED
      - name: statusMessage
        in: query
        description: The message related to the status of the order query.
        required: false
        schema:
          type: string
      - name: subitemsChecksum
        in: query
        description: The checksum of the order subitems list.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestCollectionOrder'
      security:
      - tokenAuth: []
      - auth: []
    post:
      tags:
      - Access
      operationId: access_orders_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Order'
      security:
      - tokenAuth: []
      - auth: []
    delete:
      tags:
      - Access
      operationId: access_orders_deleteList
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
      security:
      - tokenAuth: []
      - auth: []
