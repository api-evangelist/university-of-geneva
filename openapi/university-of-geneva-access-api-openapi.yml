components:
  schemas:
    Module:
      type: object
      description: The functional module.
      properties:
        name:
          type: string
          description: The name of the module.
        _links:
          $ref: '#/components/schemas/Links'
    OrderSubsetItem:
      type: object
      properties:
        creation:
          $ref: '#/components/schemas/ChangeInfo'
        lastUpdate:
          $ref: '#/components/schemas/ChangeInfo'
        resId:
          type: string
          description: The identifier of the resource. The default format is a Universally Unique IDentifier (UUID).
          maxLength: 50
          minLength: 0
        itemPath:
          type: string
        _links:
          $ref: '#/components/schemas/Links'
    StatusHistory:
      type: object
      properties:
        changeTime:
          type: string
          format: date-time
        createdBy:
          type: string
        creatorName:
          type: string
        description:
          type: string
          maxLength: 1024
          minLength: 0
        status:
          type: string
    DLCMConfig:
      type: object
      properties:
        solidify:
          $ref: '#/components/schemas/SolidifyProperties'
        dlcm.repository: {}
        solidify.index: {}
        solidify.oai-pmh: {}
        solidify.citation: {}
        dlcm: {}
        management.endpoints.web: {}
        auth: {}
        spring.datasource: {}
        spring.jpa: {}
        spring.activemq: {}
        spring.jms: {}
        spring.mail: {}
        springdoc: {}
    Security:
      type: object
      properties:
        downloadTokenLifeTimeMinutes:
          type: integer
          format: int32
        cipherPassword:
          type: string
        downloadToken:
          $ref: '#/components/schemas/DownloadToken'
    Remote:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/Origin'
    RestCollectionDisseminationInfoPackage:
      type: object
      description: 'The structure of the REST response:

        - data: the list of objects

        - page: the pagination information

        - links: the HATEOAS links

        - facets: the search information

        '
      properties:
        _links:
          $ref: '#/components/schemas/Links'
        _data:
          type: array
          items:
            $ref: '#/components/schemas/DisseminationInfoPackage'
        _facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetResult'
        _page:
          $ref: '#/components/schemas/RestCollectionPage'
    RepresentationInfo:
      type: object
      description: 'OAIS Information Package: SIP, AIP or DIP.'
      properties:
        access:
          type: string
          description: The final access level of the package.
          enum:
          - PUBLIC
          - RESTRICTED
          - CLOSED
        dataSensitivity:
          type: string
          description: The data sensitivity of the package.
          enum:
          - UNDEFINED
          - BLUE
          - GREEN
          - YELLOW
          - ORANGE
          - RED
          - CRIMSON
        dataUsePolicy:
          type: string
          description: The data use policy type of the package.
          enum:
          - NONE
          - LICENSE
          - CLICK_THROUGH_DUA
          - SIGNED_DUA
          - EXTERNAL_DUA
        complianceLevel:
          type: string
          description: The compliance level of the package.
          enum:
          - NOT_ASSESSED
          - NO_COMPLIANCE
          - WEAK_COMPLIANCE
          - AVERAGE_COMPLIANCE
          - FULL_COMPLIANCE
        description:
          type: string
          description: The description of the package.
          maxLength: 1024
          minLength: 0
        embargo:
          $ref: '#/components/schemas/EmbargoInfo'
        licenseId:
          type: string
          description: The license identifier of the package.
        metadataVersion:
          type: string
          description: The metadata version of the package.
          enum:
          - '1.0'
          - '1.1'
          - '2.0'
          - '2.1'
          - '3.0'
          - '3.1'
          - '4.0'
          - '5.0'
        name:
          type: string
          description: The name of the package.
          maxLength: 255
          minLength: 1
        organizationalUnitId:
          type: string
          description: The organizational Unit ID of the package.
          maxLength: 50
          minLength: 1
        status:
          type: string
          description: The status of the package.
          enum:
          - CHECK_PENDING
          - CHECKING
          - CHECKED
          - CLEANING
          - CLEANED
          - COMPLETED
          - DOWNLOADING
          - IN_PREPARATION
          - IN_PROGRESS
          - STORED
          - INDEXING
          - READY
          - RETRIEVING
          - RETRIEVING_PENDING
          - IN_ERROR
          - PRESERVATION_ERROR
          - FIXITY_ERROR
          - DISPOSABLE
          - DISPOSAL_APPROVED_BY_ORGUNIT
          - DISPOSAL_APPROVED
          - DISPOSED
          - FIX_PENDING
          - FIXING
          - METADATA_EDITION_PENDING
