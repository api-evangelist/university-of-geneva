          items:
            type: string
      - name: tombstoneSize
        in: query
        description: The size in bytes of the tombstone AIP.
        required: false
        schema:
          type: integer
          format: int64
      - name: updateNumber
        in: query
        description: The number of updates in the AIP.
        required: false
        schema:
          type: integer
          format: int64
      responses:
