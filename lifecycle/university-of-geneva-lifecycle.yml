gaps:
- No changelog, release notes or status page for any UNIGE API surface.
- No deprecation policy, no Sunset header, no `deprecated` flag anywhere in the contract.
- No version pinning is possible on Yareta: paths and hosts are unversioned.
- No public announcement channel for API change; the Blog RSS is institutional news, not engineering.
